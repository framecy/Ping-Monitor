name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-dmg:
    name: Build & Publish DMG
    runs-on: macos-26
    permissions:
      contents: write
    env:
      SKIP_VERSION_BUMP: "1"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 found"; ls /Applications | grep -i xcode; exit 1; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        run: ./build.sh

      - name: Locate DMG
        id: dmg
        run: |
          DMG_PATH=$(ls "$HOME/Desktop/"PingMonitor-v*.dmg | head -n1)
          echo "Found: $DMG_PATH"
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
